<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>

  <circle cx="120" cy="60" r="70" fill="#36BCF7" opacity="0.08">
    <animate attributeName="cy" values="60;90;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="170" r="90" fill="#36BCF7" opacity="0.07">
    <animate attributeName="cy" values="170;140;170" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="215" r="50" fill="#ffffff" opacity="0.04">
    <animate attributeName="r" values="50;65;50" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">John Keyrrison</text>
  <text x="500" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#36BCF7">Inteligência Artificial  •  PLN  •  LLMs &amp; RAG</text>
  <text x="500" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cfd8dc">Técnico em Informática  |  IFCE Campus Maranguape</text>
</svg>
